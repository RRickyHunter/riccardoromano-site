<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riccardo Romano — Business Architect & AI Coach</title>
  <meta name="description" content="Sito personale ufficiale di Riccardo Romano, Business Architect & AI Coach." />
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/logo-riccardo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#ffb400; --orange:#ff7a00; --ink:#10203e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:#fff;
      background:
        radial-gradient(circle at 18% 2%, rgba(255,180,0,.24), transparent 26rem),
        radial-gradient(circle at 88% 7%, rgba(46,107,255,.46), transparent 24rem),
        radial-gradient(circle at top, #2e6bff 0%, #123c8f 30%, #07142d 78%);
      text-align:center;
    }
    main { width:min(100%, 720px); }
    img { width:min(180px, 46vw); height:auto; margin-bottom:28px; filter:brightness(0) invert(1) drop-shadow(0 12px 30px rgba(0,0,0,.24)); }
    .eyebrow { display:inline-flex; padding:.48rem .85rem; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); font-size:.78rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-bottom:18px; }
    h1 { font-size:clamp(2.2rem, 8vw, 4.6rem); line-height:.95; letter-spacing:-.055em; font-weight:900; margin-bottom:14px; }
    p { color:rgba(255,255,255,.76); font-size:clamp(1rem, 3vw, 1.18rem); font-weight:600; }
    .accent { width:78px; height:4px; border-radius:999px; margin:28px auto 0; background:linear-gradient(90deg,var(--gold),var(--orange)); }
  </style>
</head>
<body>
  <main aria-label="Riccardo Romano">
    <img src="/assets/logo-riccardo.png" alt="Riccardo Romano" />
    <div class="eyebrow">Sito ufficiale</div>
    <h1>Riccardo Romano</h1>
    <p>Business Architect &amp; AI Coach</p>
    <div class="accent" aria-hidden="true"></div>
  </main>
</body>
</html>
